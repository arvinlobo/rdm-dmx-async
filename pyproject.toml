[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdm-dmx-async"
dynamic = ["version"]
description = "Modern async-first library for RDM and DMX protocols"
readme = "README-PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Arvin Lobo"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
rdm-dmx = "rdm_dmx_async.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "pre-commit>=4.6.0",
    "ruff>=0.16.0",
    "httpx>=0.27.0",
]
docs = [
    "pdoc>=14.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
exe = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pyinstaller>=6.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rdm_dmx_async*"]

[tool.setuptools.dynamic]
version = {attr = "rdm_dmx_async.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=rdm_dmx_async",
    "--cov-report=term-missing",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by Ruff formatter)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...)/ConnectRequest() default-arg pattern is intentional, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "api.schemas.ConnectRequest"]

[tool.coverage.run]
source = ["rdm_dmx_async"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
